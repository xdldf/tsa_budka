# ====================================================================
#  ВЫСОКОУРОВНЕВЫЙ КОНФИГ ФОТО-БУДКИ
# ====================================================================
#
#  ЭТО ЕДИНАЯ ТОЧКА НАСТРОЙКИ БУДКИ. Большинство настроек в коде
#  не нужно трогать — всё важное собрано здесь в трёх блоках:
#
#    1. [image]  — формат/соотношение сторон генерируемого фото
#    2. [print]  — печать (размер бумаги, размер и плотность растра)
#    3. [timer]  — длина отсчёта перед снимком
#
#  ЧТОБЫ ПОМЕНЯТЬ ФОРМАТ ФОТО — правите здесь и ничего не пишете в коде.
#
#  КАК ПРИМЕНИТЬ ИЗМЕНЕНИЯ:
#    Файл читается бэкендом при старте. После правки нужно
#    перезапустить backend (`docker compose restart backend`
#    или перезапуск процесса uvicorn).
#    Если меняли блок [timer] — перезапустите и frontend
#    (`docker compose restart frontend`), т.к. таймер фронтенд
#    получает из API при загрузке страницы камеры.
#
#  ГДЕ ЛЕЖИТ ФАЙЛ / КАК ЕГО ИЩЕТ БЭКЕНД:
#    1. переменная окружения  BOOTH_CONFIG=<путь>  (если задана)
#    2. корень репозитория:   booth.config.toml   (рядом с docker-compose.yml)
#    3. текущая рабочая папка процесса.
#    Формат — TOML. Строки в кавычках "...", числа без кавычек.
#
#  КАК БЫСТРО ПЕРЕКЛЮЧИТЬ ФОРМАТ ФОТО (несколько частых сценариев):
#
#   A) Квадрат 4x4 на ветке:
#        [image] aspect_ratio = "1:1"
#        [print] media = "w288h288"; width_px = 1200; height_px = 1200; dpi = 300
#
#   B) Вертикальное 4x6 (портрет):
#        [image] aspect_ratio = "3:4"   (или "2:3")
#        [print] media = "w288h432"; width_px = 1200; height_px = 1800; dpi = 300
#
#   C) Горизонтальное 6x4 (пейзаж):
#        [image] aspect_ratio = "4:3"
#        [print] media = "w432h288"; width_px = 1800; height_px = 1200; dpi = 300
#
#   ПРАВИЛО: пропорция [image] должна совпадать с пропорцией бумаги
#   [print], иначе фото будет входить с белыми полями (при "fit") или
#   обрезаться по краям (при "fill").
#
#   ДРУГОЙ ПРИМЕР: бумага та же, но повысить качество печати:
#     width_px = 1800; height_px = 1800; dpi = 450   (для 4x4)
#   (больше px = детальнее отпечаток, но файл крупнее и печать дольше)
#
#   ДРУГОЙ ПРИМЕР: хотим целиком фото без обрезки, но пропорции
#   не совпадают с бумагой — оставьте fit = "fit" (будут поля).
#   Хотим занять весь лист в край — поставьте fit = "fill".
#
#   ДРУГОЙ ПРИМЕР: удлинить отсчёт перед снимком:
#     [timer] countdown_seconds = 10
#
# ====================================================================

[image]
# Соотношение сторон изображения, которое генерирует модель (строка с ":").
# Именно это соотношение «просит» модель ИИ. Оно должно совпадать
# по пропорции с бумагой в [print], чтобы фото ложилось на лист
# без полей и без обрезки.
#
#  Бумага 4x4  -> "1:1"
#  Бумага 4x6  -> "3:4"  (вертикаль, портрет) или "2:3"
#  Бумага 6x4  -> "4:3"  (горизонталь, пейзаж)
#  Бумага 6x6  -> "1:1"
#
# Также модель поддерживает: "16:9", "9:16", "3:2".
#
# ПРИМЕР: для квадратной бумаги 4x4 ставьте "1:1".
aspect_ratio = "2:3"

# Качество генерации изображения ИИ.
#   "low"   — быстро, ниже детализация (экономия/скорость)
#   "medium" — баланс (по умолчанию)
#   "high"  — максимальная детализация, дольше обрабатывается
# Влияет на внешний вид итогового фото, НЕ на размер растра печати
# (размер печати задаётся в [print]).
quality = "medium"

[print]
# Включает/выключает реальную печать на принтере.
#   true  — после генерации фото уходит на принтер;
#   false — печать отключена (удобно для тестов разработчика).
enabled = true

# Имя очереди CUPS, на которую отправляется печать. Формат страницы выбирается
# автоматически из результата: 1200x1200 -> 10x10, 1200x1800 -> 10x15.
# Посмотреть свои очереди:  lpstat -p
# Создать очередь:          lpadmin -p <имя> -E -v usb://...
queue = "DP-QW410"

# Формат бумаги в CUPS (идентификатор media в PPD принтера).
#   w288h288 = 4x4  дюйма (квадрат)
#   w288h432 = 4x6  дюйма (портрет)
#   w432h288 = 6x4  дюйма (пейзаж)
#   w432h432 = 6x6  дюйма
# Проверить доступные:  lpoptions -p <имя> -l  (ищите PageSize)
media = "w288h432"

# Размер растрового изображения, которое отправляется на печать (в пикселях),
# и плотность печати (dpi). Это ПОЛНЫЙ размер листа в пикселях.
#
# Расчёт:  пиксели = дюймы * dpi.
#   4" * 300 = 1200 px,  6" * 300 = 1800 px.
#
# Меняйте dpi/px вместе под свой формат:
#   Бумага 4x4:    width_px = 1200, height_px = 1200, dpi = 300   (или 1800/1800/450)
#   Бумага 4x6:    width_px = 1200, height_px = 1800, dpi = 300
#   Бумага 6x4:    width_px = 1800, height_px = 1200, dpi = 300
#
# Чем выше dpi — тем детальнее отпечаток, но крупнее файл и дольше
# передача на принтер. QW410 в драйвере поддерживает максимум 300 dpi,
# поэтому ставим честные 300 dpi (1200x1800 для 4x6), чтобы CUPS не
# пересчитывал и не обрезал картинку.
width_px = 1200
height_px = 1800
dpi = 300

# Как уместить фото на бумаге:
#   "fit"  — показать всё фото ЦЕЛИКОМ (пропорции сохраняются, фото
#            центрируется). Если пропорции фото ≠ бумаге, по краям
#            останутся белые поля. НИЧЕГО не обрезается.
#   "fill" — заполнить весь лист в КРАЙ (как «обои»): фото растягивается
#            так, чтобы закрыть лист полностью, лишнее по краям обрезается.
#            Белых полей нет, но часть изображения может пропасть.
#
# Совет: чтобы было «в край и без обрезки», совместите aspect_ratio
# в [image] с пропорцией бумаги и оставьте "fill" (или "fit" — разницы
# при совпадающих пропорциях не будет).
fit = "fill"

# Компенсация borderless-оверскана драйвера/принтера (доля от размера листа).
# Драйвер gutenprint на QW410 слегка увеличивает растр (~x1.0033) при печати
# в край, и бумага показывает центрально обрезанное окно — теряется пара
# пикселей с каждого края. Бэкенд заранее вписывает фото чуть меньше
# (1/(1+overscan)) и достраивает по краям зеркальную «кровку» в несколько
# пикселей: оверскан съедает только её, а видимое фото остаётся 1:1 и в край.
#   0       — выключить (если принтер/драйвер не крошит);
#   -0.06   — белая рамка примерно 3 мм с каждой стороны на листе 10×10 см.
borderless_overscan = -0.06

# Дополнительные опции, передаваемые принтеру как `lp -o <option>`.
# Несколько опций разделяются пробелами.
#
# Ключевые для DNP QW410:
#   print-color-mode=color      — цветная печать;
#   print-quality=high          — высокое качество.
#
# ВАЖНО: НЕ добавлять сюда scaling / fit-to-page / StpiShrinkOutput=*.
# Бэкенд отправляет растр ТОЧНОГО размера бумаги (width_px×height_px при dpi)
# «как есть», в натуральную величину. Любая опция масштабирования заставляет
# CUPS/Gutenprint перерисовать фото на page-box PPD (у QW410 стоковый PPD
# задаёт 337.92x440.64pt — borderless-оверскан вместо реальных 288x432pt),
# и драйвер зумит/крошит снимок. Пиксель-в-пиксель 1:1 гарантирует патч
# геометрии PPD в scripts/setup-printer.sh (PageSize/PageRegion/PaperDimension/
# ImageableArea для w288h432 → 288x432pt). После правки PPD перезапустите CUPS
# (скрипт делает это сам).
#
# Для ч/б вместо color поставьте print-color-mode=monochrome.
options = "print-color-mode=color print-quality=high"

# Таймаут ожидания печати в секундах. Если принтер молчит дольше —
# операция считается зависшей и прерывается ошибкой.
timeout = 120

[timer]
# Длина отсчёта (секунды) между нажатием «Сделать снимок» и моментом
# съёмки кадра. Даёт человеку время принять позу.
#   Меньше (2-3)  — быстрее снимает;
#   Больше (8-10) — больше времени на подготовку.
# Фронтенд берёт это значение из API при открытии страницы камеры,
# поэтому после правки перезапустите frontend.
countdown_seconds = 5
